# We are using tags for associating backend events with specific services.
# You can see the available services on the apprise repo [See https://github.com/caronc/apprise#supported-notifications]

#  Tags:
#   new_vmrequest
#      These endpoints get notified when a user submits a new valid VM request through the form
#   vmrequest_accepted
#     These endpoints get notified when an admin accepts a VM request
#   vmrequest_rejected
#     These endpoints get notified when an admin rejects a VM request
#   vmcreation_update
#     These endpoints get notified during the creation of a VM, e.g error/success messages
#   vmusagesurvey
#     These endpoints get notified with messages regarding the VM Usage Surveys
#   resourcechange_new
#     New resource change requests, including requests eligible for automatic approval and undo requests
#   resourcechange_accepted
#     Resource changes applied after admin or automatic approval
#   resourcechange_rejected
#     Resource change requests rejected by an admin
#   resourcechange_failed
#     Resource changes that failed to apply
#   resourcechange_cancelled
#     Pending resource change requests cancelled by the user

